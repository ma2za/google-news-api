name: Publish
on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: "pypi"
      url: https://pypi.org/p/google-news-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release tools
        run: python -m pip install poetry==2.3.2 twine==6.2.0

      - name: Install dependencies
        run: poetry install --with dev --all-extras

      - name: Verify release version
        if: github.event_name == 'release'
        shell: bash
        run: test "v$(poetry version -s)" = "$GITHUB_REF_NAME"

      - name: Validate package
        run: |
          poetry check
          poetry run pytest -m "not integration" --strict-markers
          poetry run pytest --collect-only -q --strict-markers
          poetry build
          python -m twine check dist/*

      - name: Smoke test built artifacts
        shell: bash
        run: |
          wheel_path="$(find dist -maxdepth 1 -name 'google_news_api-*.whl' -print -quit)"
          sdist_path="$(find dist -maxdepth 1 -name 'google_news_api-*.tar.gz' -print -quit)"

          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install "$wheel_path"
          (
            cd "$RUNNER_TEMP"
            package_version="$("$RUNNER_TEMP/wheel-smoke/bin/python" -c "from importlib.metadata import version; print(version('google-news-api'))")"
            "$RUNNER_TEMP/wheel-smoke/bin/python" -c "from importlib.resources import files; from google_news_api import Article, EnrichedArticle, GoogleNewsClient; import google_news_api.mcp_server; assert files('google_news_api').joinpath('py.typed').is_file(); print(GoogleNewsClient, Article, EnrichedArticle)"
            test "$("$RUNNER_TEMP/wheel-smoke/bin/google-news" --version)" = "google-news $package_version"
            "$RUNNER_TEMP/wheel-smoke/bin/google-news" --help
            "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          )

          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install "$sdist_path"
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/sdist-smoke/bin/python" -c "from google_news_api import GoogleNewsClient, __version__; print(GoogleNewsClient, __version__)"
            "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip check
          )

          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install "${wheel_path}[mcp]"
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/wheel-smoke/bin/python" -c "from google_news_api.mcp_server import create_mcp_app; create_mcp_app()"
            "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          )

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
