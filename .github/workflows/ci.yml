name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  install-smoke:
    name: Python 3.9 install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build wheel
        run: python -m pip wheel . --wheel-dir dist

      - name: Install wheel
        run: python -m pip install --force-reinstall dist/google_news_api-*.whl

      - name: Smoke test installed wheel
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          package_version="$(python -c "from importlib.metadata import version; print(version('google-news-api'))")"
          python -c "from importlib.resources import files; from google_news_api import Article, EnrichedArticle, GoogleNewsClient; import google_news_api.mcp_server; assert files('google_news_api').joinpath('py.typed').is_file(); print(GoogleNewsClient, Article, EnrichedArticle)"
          test "$(google-news --version)" = "google-news $package_version"
          google-news --help
          python -m pip check

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint
        run: |
          poetry run black --check google_news_api tests examples mcp_server
          poetry run isort --check-only google_news_api tests examples mcp_server
          poetry run flake8 google_news_api tests examples mcp_server

      - name: Test
        run: poetry run pytest -m "not integration"
